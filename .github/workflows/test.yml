name: Tests

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/test.yml'
      - 'components/**'
      - 'test/**'
  pull_request:
    paths:
      - '.github/workflows/test.yml'
      - 'components/**'
      - 'test/**'
  workflow_dispatch:

env:
  ESPHOME_VERSION: '2026.11.0'

jobs:
  unit:
    name: Unit tests (GoogleTest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: cmake -S test -B test/build -DESPHOME_GIT_TAG=${{ env.ESPHOME_VERSION }}

      - name: Build
        run: cmake --build test/build -j

      - name: Run
        run: ctest --test-dir test/build --output-on-failure
