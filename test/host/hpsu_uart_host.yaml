# Host build of the component against a simulated HPSU: the pytest tests (conftest.py) open a
# pseudo terminal, link it to the port below and answer the requests like the HPSU.
esphome:
  name: hpsu-uart-host

host:

external_components:
  - source:
      type: local
      path: ../../components
    components: [daikin_rotex_uart]

logger:
  level: DEBUG    # the tests wait for "incomplete buffer" (debug) when sending a response in parts

api:
  port: 16054
  reboot_timeout: 0s

uart:
  id: uart_bus
  port: /tmp/hpsu-uart-pty   # symlink to the pseudo terminal, created by conftest.py
  baud_rate: 9600
  data_bits: 8
  parity: EVEN
  stop_bits: 1

daikin_rotex_uart:
  id: rotex_uart
  uart_id: uart_bus
  outdoor_unit: ERGA08EAV3
  language: de
  project_git_hash:
    name: Project Git Hash
  entities:
    outdoor_inv_compressors:
      name: outdoor_inv_compressors
    outdoor_std_compressors:
      name: outdoor_std_compressors
    outdoor_fans:
      name: outdoor_fans
    outdoor_expansion_valves:
      name: outdoor_expansion_valves
    outdoor_4_way_valves:
      name: outdoor_4_way_valves
    outdoor_crankcase_heaters:
      name: outdoor_crankcase_heaters
    outdoor_solenoid_valves:
      name: outdoor_solenoid_valves
    indoor_units_max:
      name: indoor_units_max
    indoor_units_connected:
      name: indoor_units_connected
    tgt_evap_temp:
      name: Ziel-Verdampfungstemperatur
    outdoor_temp:
      name: Aussentemperatur
    inv_prim_current:
      name: INV Primary Current
    fan_speed:
      name: Ventilatordrehzahl
    inv_freq:
      name: Kompressor Drehzahl
    heat_sink_temp:
